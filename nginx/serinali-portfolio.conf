# nginx server block for the Serina Li marketing portfolio (static site)
#
# Install:
#   sudo cp serinali-portfolio.conf /etc/nginx/sites-available/serinali-portfolio
#   sudo ln -s /etc/nginx/sites-available/serinali-portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace "example.com" below with your real domain (or the VM's IP if you
# don't have one yet), and adjust "root" to wherever you upload the files.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/serinali-portfolio;
    index index.html;

    # Gzip common text assets (images/video are already compressed, skip them)
    gzip on;
    gzip_types text/css application/javascript text/html application/json;
    gzip_min_length 512;

    # Cache hashed/static assets aggressively; HTML stays revalidated
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Small quality-of-life: most links already end in .html, but this lets
    # /project1 work too without a redirect.
    location ~ ^/(project[1-4])$ {
        try_files /$1.html =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Basic hardening
    server_tokens off;
    client_max_body_size 10m;
}

# Once you have a domain + TLS cert (e.g. via certbot), add a second
# server block on :443 and redirect :80 -> :443. Example, after running
# `sudo certbot --nginx -d example.com -d www.example.com`:
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name example.com www.example.com;
#     return 301 https://$host$request_uri;
# }
